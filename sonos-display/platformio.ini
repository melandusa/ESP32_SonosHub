; ESP32-S3 build for the Guition ESP32-S3-4848S040 (480x480 ST7701 RGB panel, GT911 touch).
; The Linux simulator is built with CMake (see README.md); both share core/ and lv_conf.h.

[platformio]
src_dir = platform_esp32
default_envs = guition_4848s040

[env:guition_4848s040]
platform = platformio/espressif32@8.0.0
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    lvgl/lvgl@9.2.2
    moononournation/GFX Library for Arduino@1.6.9
    tzapu/WiFiManager@2.0.17
    https://github.com/leethomason/tinyxml2.git#11.0.0

build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}
    -I${PROJECT_DIR}/core
    -I${PROJECT_DIR}/platform_esp32
    '-DLV_CONF_KCONFIG_EXTERNAL_INCLUDE="lv_kconfig_none.h"'

; Compile the portable core together with the ESP32 platform layer
build_src_filter = +<*> +<../core/>

; Root certificates for the HTTPS firmware download (see platform_esp32/certs/README.md)
board_build.embed_files = platform_esp32/certs/x509_crt_bundle.bin

extra_scripts =
    pre:platform_esp32/embed_font.py
    pre:platform_esp32/firmware_version.py
